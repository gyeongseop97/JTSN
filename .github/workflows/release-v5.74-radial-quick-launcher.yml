name: Publish JTSN v5.74 Radial Quick Launcher

on:
  workflow_dispatch:
  push:
    paths:
      - '.release/release-v5.74.trigger'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Patch v5.74 source
        shell: pwsh
        run: |
          function Replace-One([string]$text, [string]$pattern, [string]$replacement, [string]$label) {
            $count = [regex]::Matches($text, $pattern).Count
            if ($count -ne 1) { throw "$label expected exactly one match, got $count" }
            return [regex]::Replace($text, $pattern, $replacement, 1)
          }

          $appPath = 'app/main.go'
          $app = Get-Content $appPath -Raw
          $app = Replace-One $app 'const appVersion = "5\.73"' 'const appVersion = "5.74"' 'app version'

          $latestHeader = "const latestPatchNotes = ``v5.74`r`n`r`n• 검색형 퀵런처를 마우스 중심 도넛형 방사 메뉴로 변경`r`n• 도넛을 피자 조각처럼 분할해 각 조각 클릭 시 기능 즉시 실행`r`n• 퀵런처 전용 즐겨찾기 설정 추가 · 최대 8개 선택 가능`r`n• 선택 순서대로 12시 방향부터 시계방향 배치`r`n• 기존 메인 즐겨찾기와 퀵런처 즐겨찾기를 완전히 분리`r`n`r`nv5.73"
          $app = Replace-One $app 'const latestPatchNotes = `v5\.73' $latestHeader 'latest patch notes'

          $allHeader = "const allPatchNotes = ``잡툴사니 · JTSN 패치노트`r`n`r`nv5.74`r`n• 검색형 퀵런처를 마우스 중심 도넛형 방사 메뉴로 변경`r`n• 도넛 조각 클릭으로 기능 즉시 실행`r`n• 퀵런처 전용 즐겨찾기 설정 추가 · 최대 8개 선택 가능`r`n• 선택 순서대로 12시 방향부터 시계방향 배치`r`n• 기존 메인 즐겨찾기와 퀵런처 즐겨찾기 분리`r`n`r`nv5.73"
          $app = Replace-One $app 'const allPatchNotes = `잡툴사니 · JTSN 패치노트\r?\n\r?\nv5\.73' $allHeader 'all patch notes'

          $app = Replace-One $app 'w, h := int32\(560\), int32\(540\)' 'w, h := int32(560), int32(610)' 'settings window height'

          $oldButtons = '(?s)createOwnerButton\(hwnd, "고급 클립보드 설정", 154, 390, 238, 52, ID_SETTINGS_CLIP, BTN_SECONDARY\),\s*createOwnerButton\(hwnd, "업데이트 확인", 402, 390, 126, 52, ID_SETTINGS_UPDATE, BTN_SECONDARY\),\s*createOwnerButton\(hwnd, "완료", 414, 474, 110, 40, ID_SETTINGS_APPLY, BTN_PRIMARY\),'
          $newButtons = "createOwnerButton(hwnd, `"퀵런처 즐겨찾기 설정`", 154, 390, 374, 48, ID_SETTINGS_QUICK_FAVORITES, BTN_SECONDARY),`r`n`t`t`tcreateOwnerButton(hwnd, `"고급 클립보드 설정`", 154, 450, 238, 48, ID_SETTINGS_CLIP, BTN_SECONDARY),`r`n`t`t`tcreateOwnerButton(hwnd, `"업데이트 확인`", 402, 450, 126, 48, ID_SETTINGS_UPDATE, BTN_SECONDARY),`r`n`t`t`tcreateOwnerButton(hwnd, `"완료`", 414, 542, 110, 40, ID_SETTINGS_APPLY, BTN_PRIMARY),"
          $app = Replace-One $app $oldButtons $newButtons 'settings buttons'

          $app = Replace-One $app 'case ID_SETTINGS_CLIP:\r?\n\t\t\tlaunchTool\(ID_NAV_CLIP\)' "case ID_SETTINGS_QUICK_FAVORITES:`r`n`t`t`topenQuickFavoritesSettings()`r`n`t`tcase ID_SETTINGS_CLIP:`r`n`t`t`tlaunchTool(ID_NAV_CLIP)" 'quick favorites settings command'

          $app = Replace-One $app 'drawSettingsText\(syscall\.Handle\(hdc\), "입력란을 누른 뒤 원하는 키 조합을 누르세요\. \(최대 3키\)", RECT\{166, 362, 530, 386\}, fontSmall, rgb\(100, 116, 139\)\)' 'drawSettingsText(syscall.Handle(hdc), "단축키는 마우스 주변 도넛 퀵런처를 호출합니다. 표시할 기능은 아래에서 선택하세요.", RECT{166, 362, 530, 386}, fontSmall, rgb(100, 116, 139))' 'settings radial hint'
          Set-Content $appPath -Value $app -Encoding utf8

          $installerPath = 'installer/main.go'
          $installer = Get-Content $installerPath -Raw
          $installer = Replace-One $installer 'launcherVersion = "5\.73"' 'launcherVersion = "5.74"' 'launcher version'
          Set-Content $installerPath -Value $installer -Encoding utf8

          gofmt -w app/main.go app/quick_launcher.go installer/main.go

          $check = Get-Content app/main.go -Raw
          if ($check -notmatch 'const appVersion = "5\.74"') { throw 'app version patch failed' }
          if ($check -notmatch 'ID_SETTINGS_QUICK_FAVORITES') { throw 'quick favorites settings wiring failed' }

      - name: Build application
        shell: pwsh
        working-directory: app
        run: |
          go test -buildvcs=false ./...
          go vet -buildvcs=false ./...
          go build -buildvcs=false -trimpath -ldflags="-s -w -H windowsgui" -o JTSN_v5.74.exe .

      - name: Prepare and build installer
        shell: pwsh
        run: |
          $hash=(Get-FileHash app/JTSN_v5.74.exe -Algorithm SHA256).Hash.ToLower()
          Get-ChildItem installer/core -Filter '*.exe' -ErrorAction SilentlyContinue | Remove-Item -Force
          Copy-Item app/JTSN_v5.74.exe installer/core/JTSN_v5.74.exe -Force
          $source = Get-Content installer/main.go -Raw
          $source = [regex]::Replace($source, 'expectedCoreSHA = "[0-9a-f]*"', "expectedCoreSHA = `"$hash`"", 1)
          Set-Content installer/main.go -Value $source -Encoding utf8
          gofmt -w installer/main.go
          Push-Location installer
          go test -buildvcs=false ./...
          go vet -buildvcs=false ./...
          go build -buildvcs=false -trimpath -ldflags="-s -w -H windowsgui" -o JTSN_Setup_v5.74.exe .
          Pop-Location
          if ((Get-Item installer/JTSN_Setup_v5.74.exe).Length -lt 1000000) { throw 'installer binary unexpectedly small' }

      - name: Persist v5.74 source to main
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.go app/quick_launcher.go installer/main.go
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Add radial quick launcher in v5.74'
            git push origin HEAD:main
          }

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-source/JTSN_v5.74_FULL_SOURCE | Out-Null
          Copy-Item app,installer,.github,scripts release-source/JTSN_v5.74_FULL_SOURCE -Recurse
          Copy-Item README.md,RELEASE_POLICY.md release-source/JTSN_v5.74_FULL_SOURCE
          Get-ChildItem release-source/JTSN_v5.74_FULL_SOURCE -Filter '*.exe' -Recurse | Remove-Item -Force
          Compress-Archive -Path release-source/JTSN_v5.74_FULL_SOURCE -DestinationPath JTSN_v5.74_FULL_SOURCE.zip

          $installerHash=(Get-FileHash installer/JTSN_Setup_v5.74.exe -Algorithm SHA256).Hash.ToLower()
          $sourceHash=(Get-FileHash JTSN_v5.74_FULL_SOURCE.zip -Algorithm SHA256).Hash.ToLower()
          "$installerHash  JTSN_Setup_v5.74.exe" | Set-Content -Encoding ascii JTSN_Setup_v5.74.exe.sha256.txt
          @("$installerHash  JTSN_Setup_v5.74.exe", "$sourceHash  JTSN_v5.74_FULL_SOURCE.zip") | Set-Content -Encoding ascii JTSN_v5.74_SHA256SUMS.txt
          @(
            '## v5.74 도넛형 퀵런처', '',
            '- 마우스 포인터 주변에 원형 도넛 퀵런처 표시',
            '- 즐겨찾기 개수에 따라 도넛을 동일 각도의 조각으로 자동 분할',
            '- 조각에 기능 아이콘과 이름 표시, hover 강조, 클릭 즉시 실행',
            '- 설정 > 퀵런처 즐겨찾기 설정에서 최대 8개 별도 선택',
            '- 선택 순서가 12시 방향부터 시계방향 배치 순서가 됨',
            '- 기존 메인 화면 즐겨찾기와 퀵런처 즐겨찾기는 서로 독립'
          ) | Set-Content -Encoding utf8 RELEASE_NOTES.md

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v5.74 installer/JTSN_Setup_v5.74.exe JTSN_Setup_v5.74.exe.sha256.txt JTSN_v5.74_FULL_SOURCE.zip JTSN_v5.74_SHA256SUMS.txt --target main --title "JTSN v5.74 Radial Quick Launcher" --notes-file RELEASE_NOTES.md --latest
