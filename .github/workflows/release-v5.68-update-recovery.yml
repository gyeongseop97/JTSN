name: Publish JTSN v5.68 Update Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - '.release/release-v5.68.trigger'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Format and verify source
        shell: pwsh
        run: |
          gofmt -w app/main.go installer/main.go
          $app = Get-Content app/main.go -Raw
          $installer = Get-Content installer/main.go -Raw
          if ($app -notmatch 'const appVersion = "5\.68"') { throw 'app version not updated' }
          if ($app -notmatch 'func installedLauncherPath') { throw 'launcher path fallback missing' }
          if ($app -notmatch 'func showUpdateCheckErrorOnce') { throw 'app update error reporting missing' }
          if ($installer -notmatch 'launcherVersion = "5\.68"') { throw 'launcher version not updated' }
          if ($installer -notmatch 'func reportBackgroundUpdateError') { throw 'background error reporting missing' }

      - name: Build application
        shell: pwsh
        working-directory: app
        run: |
          go test -buildvcs=false ./...
          go vet -buildvcs=false ./...
          go build -buildvcs=false -trimpath -ldflags="-s -w -H windowsgui" -o JTSN_v5.68.exe .
          $coreHash=(Get-FileHash JTSN_v5.68.exe -Algorithm SHA256).Hash.ToLower()
          "CORE_SHA256=$coreHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installer
        shell: pwsh
        run: |
          Get-ChildItem installer/core -Filter '*.exe' -ErrorAction SilentlyContinue | Remove-Item -Force
          Copy-Item app/JTSN_v5.68.exe installer/core/JTSN_v5.68.exe -Force
          $source = Get-Content installer/main.go -Raw
          $source = [regex]::Replace($source, 'expectedCoreSHA = "[0-9a-f]*"', "expectedCoreSHA = `"$env:CORE_SHA256`"", 1)
          Set-Content installer/main.go -Value $source -Encoding utf8
          gofmt -w installer/main.go
          Push-Location installer
          go test -buildvcs=false ./...
          go vet -buildvcs=false ./...
          go build -buildvcs=false -trimpath -ldflags="-s -w -H windowsgui" -o JTSN_Setup_v5.68.exe .
          Pop-Location
          if ((Get-Item installer/JTSN_Setup_v5.68.exe).Length -lt 1000000) { throw 'installer binary unexpectedly small' }

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-source/JTSN_v5.68_FULL_SOURCE | Out-Null
          Copy-Item app release-source/JTSN_v5.68_FULL_SOURCE/app -Recurse
          Copy-Item installer release-source/JTSN_v5.68_FULL_SOURCE/installer -Recurse
          Remove-Item release-source/JTSN_v5.68_FULL_SOURCE/app/JTSN_v5.68.exe -Force
          Remove-Item release-source/JTSN_v5.68_FULL_SOURCE/installer/JTSN_Setup_v5.68.exe -Force
          Get-ChildItem release-source/JTSN_v5.68_FULL_SOURCE/installer/core -Filter '*.exe' | Remove-Item -Force
          Copy-Item .github release-source/JTSN_v5.68_FULL_SOURCE/.github -Recurse
          Copy-Item scripts release-source/JTSN_v5.68_FULL_SOURCE/scripts -Recurse
          Copy-Item README.md,RELEASE_POLICY.md release-source/JTSN_v5.68_FULL_SOURCE
          Compress-Archive -Path release-source/JTSN_v5.68_FULL_SOURCE -DestinationPath JTSN_v5.68_FULL_SOURCE.zip
          $installerHash=(Get-FileHash installer/JTSN_Setup_v5.68.exe -Algorithm SHA256).Hash.ToLower()
          $sourceHash=(Get-FileHash JTSN_v5.68_FULL_SOURCE.zip -Algorithm SHA256).Hash.ToLower()
          @(
            "$installerHash  JTSN_Setup_v5.68.exe",
            "$sourceHash  JTSN_v5.68_FULL_SOURCE.zip"
          ) | Set-Content -Encoding ascii JTSN_v5.68_SHA256SUMS.txt
          @(
            '## v5.68',
            '',
            '- 자동 업데이트 조회 실패 원인을 사용자에게 안내',
            '- LOCALAPPDATA가 변경된 PC에서도 실행 중인 본체 기준으로 설치 경로 자동 탐색',
            '- 업데이트 확인 프로세스 실행 실패 시 설정 화면에서 즉시 재시도 안내',
            '- 자동 검사 프로세스가 장시간 대기 상태로 남는 문제 개선',
            '- 동일한 자동 조회 오류는 24시간에 한 번만 안내',
            '- 기존 v5.67 기능과 UI 안정화 수정 유지',
            '',
            'v5.66 사용자는 자동 업데이트 경로가 동작하지 않을 수 있으므로 v5.68 설치파일을 한 번 직접 실행해 주세요.'
          ) | Set-Content -Encoding utf8 RELEASE_NOTES.md

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v5.68 installer/JTSN_Setup_v5.68.exe JTSN_v5.68_FULL_SOURCE.zip JTSN_v5.68_SHA256SUMS.txt --target main --title "JTSN v5.68" --notes-file RELEASE_NOTES.md --latest
