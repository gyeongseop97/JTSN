name: Publish JTSN v5.71 Update Dialog Hotfix

on:
  workflow_dispatch:
  push:
    paths:
      - '.release/release-v5.71.trigger'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Patch v5.71 source
        shell: pwsh
        run: |
          function Replace-One([string]$text, [string]$pattern, [string]$replacement, [string]$label) {
            $count = [regex]::Matches($text, $pattern).Count
            if ($count -ne 1) { throw "$label expected exactly one match, got $count" }
            return [regex]::Replace($text, $pattern, $replacement, 1)
          }

          $appPath = 'app/main.go'
          $app = Get-Content $appPath -Raw

          $app = Replace-One $app 'const appVersion = "5\.70"' 'const appVersion = "5.71"' 'app version'

          $manualPattern = '(?m)(\tcmd := exec\.Command\(launcher, "--manual-update-check", strconv\.Itoa\(os\.Getpid\(\)\)\)\r?\n)\tcmd\.SysProcAttr = &syscall\.SysProcAttr\{HideWindow: true\}\r?\n'
          $app = Replace-One $app $manualPattern '$1' 'manual update hidden process'

          $backgroundPattern = '(?m)(\t\tcmd := exec\.Command\(launcher, "--background-update-check", strconv\.Itoa\(os\.Getpid\(\)\)\)\r?\n)\t\tcmd\.SysProcAttr = &syscall\.SysProcAttr\{HideWindow: true\}\r?\n'
          $app = Replace-One $app $backgroundPattern '$1' 'background update hidden process'

          $latestHeader = "const latestPatchNotes = ``v5.71`r`n`r`n• 설정의 '업데이트 확인' 결과창이 보이지 않던 문제 수정`r`n• 자동 업데이트 알림 프로세스를 숨김 실행하지 않도록 변경`r`n• 새 버전 안내·최신 상태·오류 안내 팝업이 정상적으로 표시되도록 보강`r`n• 릴리스 체크섬 파일 탐색 호환성 개선`r`n`r`nv5.70"
          $app = Replace-One $app 'const latestPatchNotes = `v5\.70' $latestHeader 'latest patch notes'

          $allHeader = "const allPatchNotes = ``잡툴사니 · JTSN 패치노트`r`n`r`nv5.71`r`n• 설정의 '업데이트 확인' 결과창이 보이지 않던 문제 수정`r`n• 자동 업데이트 알림 프로세스를 숨김 실행하지 않도록 변경`r`n• 새 버전 안내·최신 상태·오류 안내 팝업이 정상적으로 표시되도록 보강`r`n• 릴리스 체크섬 파일 탐색 호환성 개선`r`n`r`nv5.70"
          $app = Replace-One $app 'const allPatchNotes = `잡툴사니 · JTSN 패치노트\r?\n\r?\nv5\.70' $allHeader 'all patch notes'

          Set-Content $appPath -Value $app -Encoding utf8

          $installerPath = 'installer/main.go'
          $installer = Get-Content $installerPath -Raw
          $installer = Replace-One $installer 'launcherVersion = "5\.70"' 'launcherVersion = "5.71"' 'launcher version'
          $installer = Replace-One $installer 'if strings\.HasSuffix\(name, "\.sha256"\) \|\| strings\.HasSuffix\(name, "\.sha256\.txt"\) \{' 'if strings.HasSuffix(name, ".sha256") || strings.HasSuffix(name, ".sha256.txt") || strings.Contains(name, "sha256sums") {' 'checksum discovery'
          Set-Content $installerPath -Value $installer -Encoding utf8

          gofmt -w app/main.go installer/main.go

          $check = Get-Content app/main.go -Raw
          if ($check -notmatch 'const appVersion = "5\.71"') { throw 'app version patch failed' }
          if ($check -match '--manual-update-check".*?HideWindow: true') { throw 'manual update still hidden' }
          if ($check -match '--background-update-check".*?HideWindow: true') { throw 'background update still hidden' }

      - name: Build application
        shell: pwsh
        working-directory: app
        run: |
          go test -buildvcs=false ./...
          go vet -buildvcs=false ./...
          go build -buildvcs=false -trimpath -ldflags="-s -w -H windowsgui" -o JTSN_v5.71.exe .

      - name: Prepare and build installer
        shell: pwsh
        run: |
          $hash=(Get-FileHash app/JTSN_v5.71.exe -Algorithm SHA256).Hash.ToLower()
          Get-ChildItem installer/core -Filter '*.exe' -ErrorAction SilentlyContinue | Remove-Item -Force
          Copy-Item app/JTSN_v5.71.exe installer/core/JTSN_v5.71.exe -Force
          $source = Get-Content installer/main.go -Raw
          $source = [regex]::Replace($source, 'expectedCoreSHA = "[0-9a-f]*"', "expectedCoreSHA = `"$hash`"", 1)
          Set-Content installer/main.go -Value $source -Encoding utf8
          gofmt -w installer/main.go
          Push-Location installer
          go test -buildvcs=false ./...
          go vet -buildvcs=false ./...
          go build -buildvcs=false -trimpath -ldflags="-s -w -H windowsgui" -o JTSN_Setup_v5.71.exe .
          Pop-Location
          if ((Get-Item installer/JTSN_Setup_v5.71.exe).Length -lt 1000000) { throw 'installer binary unexpectedly small' }

      - name: Persist hotfix source to main
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.go installer/main.go
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Fix update dialog visibility in v5.71'
            git push origin HEAD:main
          }

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-source/JTSN_v5.71_FULL_SOURCE | Out-Null
          Copy-Item app,installer,.github,scripts release-source/JTSN_v5.71_FULL_SOURCE -Recurse
          Copy-Item README.md,RELEASE_POLICY.md release-source/JTSN_v5.71_FULL_SOURCE
          Get-ChildItem release-source/JTSN_v5.71_FULL_SOURCE -Filter '*.exe' -Recurse | Remove-Item -Force
          Compress-Archive -Path release-source/JTSN_v5.71_FULL_SOURCE -DestinationPath JTSN_v5.71_FULL_SOURCE.zip

          $installerHash=(Get-FileHash installer/JTSN_Setup_v5.71.exe -Algorithm SHA256).Hash.ToLower()
          $sourceHash=(Get-FileHash JTSN_v5.71_FULL_SOURCE.zip -Algorithm SHA256).Hash.ToLower()
          "$installerHash  JTSN_Setup_v5.71.exe" | Set-Content -Encoding ascii JTSN_Setup_v5.71.exe.sha256.txt
          @("$installerHash  JTSN_Setup_v5.71.exe", "$sourceHash  JTSN_v5.71_FULL_SOURCE.zip") | Set-Content -Encoding ascii JTSN_v5.71_SHA256SUMS.txt
          @(
            '## v5.71 업데이트 알림 핫픽스', '',
            '- 설정의 업데이트 확인 버튼을 눌러도 반응이 보이지 않던 문제 수정',
            '- 시작 후 자동 업데이트 알림 프로세스가 숨김 상태로 실행되던 문제 수정',
            '- 최신 버전/오류/업데이트 안내 팝업을 정상 표시하도록 변경',
            '- 구버전에서도 인식 가능한 .sha256.txt 체크섬 파일 추가'
          ) | Set-Content -Encoding utf8 RELEASE_NOTES.md

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v5.71 installer/JTSN_Setup_v5.71.exe JTSN_Setup_v5.71.exe.sha256.txt JTSN_v5.71_FULL_SOURCE.zip JTSN_v5.71_SHA256SUMS.txt --target main --title "JTSN v5.71 Update Dialog Hotfix" --notes-file RELEASE_NOTES.md --latest
