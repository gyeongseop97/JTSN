name: Publish JTSN v5.67 Manual Update

on:
  workflow_dispatch:
  push:
    paths:
      - '.release/release-v5.67.trigger'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Patch v5.67 source
        shell: pwsh
        run: |
          python scripts/patch_v567.py
          python scripts/patch_v567_all_patchnotes.py
          gofmt -w app/main.go installer/main.go

      - name: Verify source changes
        shell: pwsh
        run: |
          $app = Get-Content app/main.go -Raw
          $installer = Get-Content installer/main.go -Raw
          if ($app -notmatch 'const appVersion = "5\.67"') { throw 'app version not updated' }
          if ($app -notmatch 'ID_SETTINGS_UPDATE') { throw 'settings update button missing' }
          if ($app -notmatch 'func checkForUpdateManually') { throw 'manual update app function missing' }
          if ($app -notmatch 'const latestPatchNotes = `v5\.67') { throw 'v5.67 latest patch notes missing' }
          if ($app -notmatch 'const allPatchNotes = `잡툴사니 · JTSN 패치노트\s+v5\.67') { throw 'v5.67 full patch notes missing' }
          if ($app -notmatch 'v5\.66') { throw 'v5.66 patch notes missing' }
          if ($installer -notmatch 'launcherVersion = "5\.67"') { throw 'launcher version not updated' }
          if ($installer -notmatch '--manual-update-check') { throw 'manual update launcher argument missing' }
          if ($installer -notmatch 'func manualUpdateCheck') { throw 'manual update launcher function missing' }

      - name: Build application
        shell: pwsh
        working-directory: app
        run: |
          go test -buildvcs=false ./...
          go vet -buildvcs=false ./...
          go build -buildvcs=false -trimpath -ldflags="-s -w -H windowsgui" -o JTSN_v5.67.exe .
          $coreHash=(Get-FileHash JTSN_v5.67.exe -Algorithm SHA256).Hash.ToLower()
          "CORE_SHA256=$coreHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installer
        shell: pwsh
        run: |
          Get-ChildItem installer/core -Filter '*.exe' -ErrorAction SilentlyContinue | Remove-Item -Force
          Copy-Item app/JTSN_v5.67.exe installer/core/JTSN_v5.67.exe -Force
          $coreFiles = @(Get-ChildItem installer/core -Filter '*.exe')
          if ($coreFiles.Count -ne 1) { throw "expected one embedded core, got $($coreFiles.Count)" }
          $source = Get-Content installer/main.go -Raw
          $source = [regex]::Replace($source, 'expectedCoreSHA = "[0-9a-f]*"', "expectedCoreSHA = `"$env:CORE_SHA256`"", 1)
          Set-Content installer/main.go -Value $source -Encoding utf8
          gofmt -w installer/main.go
          Push-Location installer
          go test -buildvcs=false ./...
          go vet -buildvcs=false ./...
          go build -buildvcs=false -trimpath -ldflags="-s -w -H windowsgui" -o JTSN_Setup_v5.67.exe .
          Pop-Location
          if ((Get-Item installer/JTSN_Setup_v5.67.exe).Length -lt 1000000) { throw 'installer binary unexpectedly small' }

      - name: Commit v5.67 source
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.go installer/main.go
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Complete v5.67 manual update and patch note history'
            git push origin HEAD:main
          }

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-source/JTSN_v5.67_FULL_SOURCE | Out-Null
          Copy-Item app release-source/JTSN_v5.67_FULL_SOURCE/app -Recurse
          Copy-Item installer release-source/JTSN_v5.67_FULL_SOURCE/installer -Recurse
          Remove-Item release-source/JTSN_v5.67_FULL_SOURCE/app/JTSN_v5.67.exe -Force
          Remove-Item release-source/JTSN_v5.67_FULL_SOURCE/installer/JTSN_Setup_v5.67.exe -Force
          Get-ChildItem release-source/JTSN_v5.67_FULL_SOURCE/installer/core -Filter '*.exe' | Remove-Item -Force
          Copy-Item .github release-source/JTSN_v5.67_FULL_SOURCE/.github -Recurse
          Compress-Archive -Path release-source/JTSN_v5.67_FULL_SOURCE -DestinationPath JTSN_v5.67_FULL_SOURCE.zip
          $installerHash=(Get-FileHash installer/JTSN_Setup_v5.67.exe -Algorithm SHA256).Hash.ToLower()
          $sourceHash=(Get-FileHash JTSN_v5.67_FULL_SOURCE.zip -Algorithm SHA256).Hash.ToLower()
          @(
            "$installerHash  JTSN_Setup_v5.67.exe",
            "$sourceHash  JTSN_v5.67_FULL_SOURCE.zip"
          ) | Set-Content -Encoding ascii JTSN_v5.67_SHA256SUMS.txt
          @(
            '## v5.67',
            '',
            '- 설정 화면에 업데이트 확인 버튼 추가',
            '- 현재 버전과 GitHub 최신 릴리스를 사용자가 직접 비교할 수 있도록 개선',
            '- 새 버전이 있으면 수동으로 즉시 업데이트 가능',
            '- 최신 버전 사용 중일 때와 네트워크 조회 실패 시 안내 메시지 추가',
            '- 자동 업데이트 기능은 기존 방식 그대로 유지',
            '- 프로그램 내부 업데이트 내역에 누락됐던 v5.64, v5.65, v5.66 패치노트 보완'
          ) | Set-Content -Encoding utf8 RELEASE_NOTES.md

      - name: Publish or refresh GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view v5.67 2>$null) {
            gh release upload v5.67 installer/JTSN_Setup_v5.67.exe JTSN_v5.67_FULL_SOURCE.zip JTSN_v5.67_SHA256SUMS.txt --clobber
            gh release edit v5.67 --title "JTSN v5.67" --notes-file RELEASE_NOTES.md --latest
          } else {
            gh release create v5.67 installer/JTSN_Setup_v5.67.exe JTSN_v5.67_FULL_SOURCE.zip JTSN_v5.67_SHA256SUMS.txt --target main --title "JTSN v5.67" --notes-file RELEASE_NOTES.md --latest
          }
