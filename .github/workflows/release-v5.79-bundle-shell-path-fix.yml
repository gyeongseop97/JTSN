name: Publish JTSN v5.79 Bundle Shell Path Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.release/release-v5.79.trigger'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Patch v5.79 source
        shell: pwsh
        run: |
          python scripts/patch_v579.py
          gofmt -w app/main.go app/bundle.go installer/main.go

      - name: Verify bundle shell repair
        shell: pwsh
        run: |
          $bundle = Get-Content app/bundle.go -Raw
          $installer = Get-Content installer/main.go -Raw
          if ($bundle -notmatch 'HKCU\\Software\\Classes\\\*\\shell\\JTSNBundle') { throw 'valid file context registry key missing' }
          if ($bundle -match 'HKCU\\\\Software') { throw 'malformed double-backslash registry key remains in bundle.go' }
          if ($installer -match 'HKCU\\\\Software') { throw 'malformed double-backslash registry key remains in installer/main.go' }
          if ($bundle -notmatch '!filepath\.IsAbs\(raw\)') { throw 'absolute-path guard missing' }
          if ($installer -notmatch 'repairBundleExplorerMenuIfRegistered') { throw 'context menu auto repair missing' }

      - name: Build application
        shell: pwsh
        working-directory: app
        run: |
          go test -buildvcs=false ./...
          go vet -buildvcs=false ./...
          go build -buildvcs=false -trimpath -ldflags="-s -w -H windowsgui" -o JTSN_v5.79.exe .

      - name: Prepare and build installer
        shell: pwsh
        run: |
          $hash=(Get-FileHash app/JTSN_v5.79.exe -Algorithm SHA256).Hash.ToLower()
          Get-ChildItem installer/core -Filter '*.exe' -ErrorAction SilentlyContinue | Remove-Item -Force
          Copy-Item app/JTSN_v5.79.exe installer/core/JTSN_v5.79.exe -Force
          $source = Get-Content installer/main.go -Raw
          $source = [regex]::Replace($source, 'expectedCoreSHA = "[0-9a-f]*"', "expectedCoreSHA = `"$hash`"", 1)
          Set-Content installer/main.go -Value $source -Encoding utf8
          gofmt -w installer/main.go
          Push-Location installer
          go test -buildvcs=false ./...
          go vet -buildvcs=false ./...
          go build -buildvcs=false -trimpath -ldflags="-s -w -H windowsgui" -o JTSN_Setup_v5.79.exe .
          Pop-Location
          if ((Get-Item installer/JTSN_Setup_v5.79.exe).Length -lt 1000000) { throw 'installer binary unexpectedly small' }

      - name: Persist v5.79 source to main
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.go app/bundle.go installer/main.go
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Fix Explorer new-folder path handling in v5.79'
            git push origin HEAD:main
          }

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-source/JTSN_v5.79_FULL_SOURCE | Out-Null
          Copy-Item app,installer,.github,scripts release-source/JTSN_v5.79_FULL_SOURCE -Recurse
          Copy-Item README.md,RELEASE_POLICY.md release-source/JTSN_v5.79_FULL_SOURCE
          Get-ChildItem release-source/JTSN_v5.79_FULL_SOURCE -Filter '*.exe' -Recurse | Remove-Item -Force
          Compress-Archive -Path release-source/JTSN_v5.79_FULL_SOURCE -DestinationPath JTSN_v5.79_FULL_SOURCE.zip
          $installerHash=(Get-FileHash installer/JTSN_Setup_v5.79.exe -Algorithm SHA256).Hash.ToLower()
          $sourceHash=(Get-FileHash JTSN_v5.79_FULL_SOURCE.zip -Algorithm SHA256).Hash.ToLower()
          "$installerHash  JTSN_Setup_v5.79.exe" | Set-Content -Encoding ascii JTSN_Setup_v5.79.exe.sha256.txt
          @("$installerHash  JTSN_Setup_v5.79.exe", "$sourceHash  JTSN_v5.79_FULL_SOURCE.zip") | Set-Content -Encoding ascii JTSN_v5.79_SHA256SUMS.txt
          @(
            '## v5.79 파일 우클릭 새 폴더 경로 수정', '',
            '- C:\Windows에 새 폴더를 만들려던 오류 수정',
            '- 탐색기 우클릭 레지스트리 경로의 백슬래시 표기 수정',
            '- 기존 등록 메뉴를 현재 JTSN.exe 경로로 업데이트 시 자동 복구',
            '- 상대경로 인자가 들어오면 파일 이동을 수행하지 않는 안전장치 추가'
          ) | Set-Content -Encoding utf8 RELEASE_NOTES.md

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v5.79 installer/JTSN_Setup_v5.79.exe JTSN_Setup_v5.79.exe.sha256.txt JTSN_v5.79_FULL_SOURCE.zip JTSN_v5.79_SHA256SUMS.txt --target main --title "JTSN v5.79 Bundle Shell Path Fix" --notes-file RELEASE_NOTES.md --latest
