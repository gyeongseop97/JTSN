name: Publish JTSN v5.78 Bundle Context Fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.release/release-v5.78.trigger'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Patch v5.78 source
        shell: pwsh
        run: |
          python scripts/patch_v578.py
          gofmt -w app/main.go app/bundle.go installer/main.go

      - name: Verify bundle context integration
        shell: pwsh
        run: |
          $bundle = Get-Content app/bundle.go -Raw
          $installer = Get-Content installer/main.go -Raw
          if ($bundle -notmatch 'installedLauncherPath\(\)') { throw 'stable launcher registration missing' }
          if ($bundle -notmatch '--bundle-shell') { throw 'bundle shell command missing' }
          if ($installer -notmatch 'repairBundleExplorerMenuIfRegistered') { throw 'context menu auto repair missing' }
          if ($installer -notmatch 'installedPath\(\)') { throw 'stable installed launcher path missing' }

      - name: Build application
        shell: pwsh
        working-directory: app
        run: |
          go test -buildvcs=false ./...
          go vet -buildvcs=false ./...
          go build -buildvcs=false -trimpath -ldflags="-s -w -H windowsgui" -o JTSN_v5.78.exe .

      - name: Prepare and build installer
        shell: pwsh
        run: |
          $hash=(Get-FileHash app/JTSN_v5.78.exe -Algorithm SHA256).Hash.ToLower()
          Get-ChildItem installer/core -Filter '*.exe' -ErrorAction SilentlyContinue | Remove-Item -Force
          Copy-Item app/JTSN_v5.78.exe installer/core/JTSN_v5.78.exe -Force
          $source = Get-Content installer/main.go -Raw
          $source = [regex]::Replace($source, 'expectedCoreSHA = "[0-9a-f]*"', "expectedCoreSHA = `"$hash`"", 1)
          Set-Content installer/main.go -Value $source -Encoding utf8
          gofmt -w installer/main.go
          Push-Location installer
          go test -buildvcs=false ./...
          go vet -buildvcs=false ./...
          go build -buildvcs=false -trimpath -ldflags="-s -w -H windowsgui" -o JTSN_Setup_v5.78.exe .
          Pop-Location
          if ((Get-Item installer/JTSN_Setup_v5.78.exe).Length -lt 1000000) { throw 'installer binary unexpectedly small' }

      - name: Persist v5.78 source to main
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.go app/bundle.go installer/main.go
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Fix Explorer bundle context menu in v5.78'
            git push origin HEAD:main
          }

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-source/JTSN_v5.78_FULL_SOURCE | Out-Null
          Copy-Item app,installer,.github,scripts release-source/JTSN_v5.78_FULL_SOURCE -Recurse
          Copy-Item README.md,RELEASE_POLICY.md release-source/JTSN_v5.78_FULL_SOURCE
          Get-ChildItem release-source/JTSN_v5.78_FULL_SOURCE -Filter '*.exe' -Recurse | Remove-Item -Force
          Compress-Archive -Path release-source/JTSN_v5.78_FULL_SOURCE -DestinationPath JTSN_v5.78_FULL_SOURCE.zip
          $installerHash=(Get-FileHash installer/JTSN_Setup_v5.78.exe -Algorithm SHA256).Hash.ToLower()
          $sourceHash=(Get-FileHash JTSN_v5.78_FULL_SOURCE.zip -Algorithm SHA256).Hash.ToLower()
          "$installerHash  JTSN_Setup_v5.78.exe" | Set-Content -Encoding ascii JTSN_Setup_v5.78.exe.sha256.txt
          @("$installerHash  JTSN_Setup_v5.78.exe", "$sourceHash  JTSN_v5.78_FULL_SOURCE.zip") | Set-Content -Encoding ascii JTSN_v5.78_SHA256SUMS.txt
          @(
            '## v5.78 파일 우클릭 새 폴더 기능 복구', '',
            '- 파일/폴더 우클릭의 JTSN 새 폴더에 넣기 실행 경로 안정화',
            '- 버전별 Core EXE 대신 고정 JTSN.exe 런처를 호출하도록 변경',
            '- 기존에 등록된 우클릭 메뉴도 업데이트 시 현재 설치 경로로 자동 복구',
            '- 업데이트 이후에도 우클릭 메뉴가 새 버전에서 계속 동작하도록 보강'
          ) | Set-Content -Encoding utf8 RELEASE_NOTES.md

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v5.78 installer/JTSN_Setup_v5.78.exe JTSN_Setup_v5.78.exe.sha256.txt JTSN_v5.78_FULL_SOURCE.zip JTSN_v5.78_SHA256SUMS.txt --target main --title "JTSN v5.78 Bundle Context Fix" --notes-file RELEASE_NOTES.md --latest
