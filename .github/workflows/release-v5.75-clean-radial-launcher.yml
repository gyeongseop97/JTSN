name: Publish JTSN v5.75 Clean Radial Launcher

on:
  workflow_dispatch:
  push:
    paths:
      - '.release/release-v5.75.trigger'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Patch v5.75 source
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/patch_v575.ps1

      - name: Build application
        shell: pwsh
        working-directory: app
        run: |
          go test -buildvcs=false ./...
          go vet -buildvcs=false ./...
          go build -buildvcs=false -trimpath -ldflags="-s -w -H windowsgui" -o JTSN_v5.75.exe .

      - name: Prepare and build installer
        shell: pwsh
        run: |
          $hash=(Get-FileHash app/JTSN_v5.75.exe -Algorithm SHA256).Hash.ToLower()
          Get-ChildItem installer/core -Filter '*.exe' -ErrorAction SilentlyContinue | Remove-Item -Force
          Copy-Item app/JTSN_v5.75.exe installer/core/JTSN_v5.75.exe -Force
          $source = Get-Content installer/main.go -Raw
          $source = [regex]::Replace($source, 'expectedCoreSHA = "[0-9a-f]*"', "expectedCoreSHA = `"$hash`"", 1)
          Set-Content installer/main.go -Value $source -Encoding utf8
          gofmt -w installer/main.go
          Push-Location installer
          go test -buildvcs=false ./...
          go vet -buildvcs=false ./...
          go build -buildvcs=false -trimpath -ldflags="-s -w -H windowsgui" -o JTSN_Setup_v5.75.exe .
          Pop-Location
          if ((Get-Item installer/JTSN_Setup_v5.75.exe).Length -lt 1000000) { throw 'installer binary unexpectedly small' }

      - name: Persist v5.75 source to main
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.go app/quick_launcher.go installer/main.go
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Polish radial quick launcher in v5.75'
            git push origin HEAD:main
          }

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-source/JTSN_v5.75_FULL_SOURCE | Out-Null
          Copy-Item app,installer,.github,scripts release-source/JTSN_v5.75_FULL_SOURCE -Recurse
          Copy-Item README.md,RELEASE_POLICY.md release-source/JTSN_v5.75_FULL_SOURCE
          Get-ChildItem release-source/JTSN_v5.75_FULL_SOURCE -Filter '*.exe' -Recurse | Remove-Item -Force
          Compress-Archive -Path release-source/JTSN_v5.75_FULL_SOURCE -DestinationPath JTSN_v5.75_FULL_SOURCE.zip

          $installerHash=(Get-FileHash installer/JTSN_Setup_v5.75.exe -Algorithm SHA256).Hash.ToLower()
          $sourceHash=(Get-FileHash JTSN_v5.75_FULL_SOURCE.zip -Algorithm SHA256).Hash.ToLower()
          "$installerHash  JTSN_Setup_v5.75.exe" | Set-Content -Encoding ascii JTSN_Setup_v5.75.exe.sha256.txt
          @("$installerHash  JTSN_Setup_v5.75.exe", "$sourceHash  JTSN_v5.75_FULL_SOURCE.zip") | Set-Content -Encoding ascii JTSN_v5.75_SHA256SUMS.txt
          @(
            '## v5.75 퀵런처 그래픽 개선', '',
            '- 사각 팝업 배경과 사각형 DWM 그림자를 제거하여 도넛만 표시',
            '- 도넛 표시 영역과 실제 윈도우 영역을 정확히 일치시켜 외곽 잔상 제거',
            '- 도넛 크기/두께/조각선을 재조정',
            '- 아이콘과 축약 기능명을 각 조각 중앙에 일관된 세로 스택으로 배치',
            '- 기존 퀵런처 전용 즐겨찾기 설정은 그대로 유지'
          ) | Set-Content -Encoding utf8 RELEASE_NOTES.md

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v5.75 installer/JTSN_Setup_v5.75.exe JTSN_Setup_v5.75.exe.sha256.txt JTSN_v5.75_FULL_SOURCE.zip JTSN_v5.75_SHA256SUMS.txt --target main --title "JTSN v5.75 Clean Radial Launcher" --notes-file RELEASE_NOTES.md --latest
