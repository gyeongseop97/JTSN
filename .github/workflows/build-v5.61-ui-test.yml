name: Build JTSN v5.63 Update UI Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Apply v5.63 test changes
        run: git apply v5.63-update-ui.patch
      - name: Build and verify application
        shell: pwsh
        working-directory: app
        run: |
          gofmt -w .
          go test -buildvcs=false ./...
          go vet -buildvcs=false ./...
          go build -buildvcs=false -trimpath -ldflags="-s -w -H windowsgui" -o JTSN_v5.63.exe .
          $coreHash=(Get-FileHash JTSN_v5.63.exe -Algorithm SHA256).Hash.ToLower()
          "CORE_SHA256=$coreHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Prepare installer
        shell: pwsh
        run: |
          Copy-Item app/JTSN_v5.63.exe installer/core/JTSN_v5.63.exe -Force
          $source = Get-Content installer/main.go -Raw
          $source = $source.Replace('core/JTSN_v5.61.exe', 'core/JTSN_v5.63.exe')
          $source = [regex]::Replace($source, 'expectedCoreSHA = "[0-9a-f]+"', "expectedCoreSHA = `"$env:CORE_SHA256`"")
          Set-Content installer/main.go -Value $source -Encoding utf8
      - name: Build installer
        shell: pwsh
        working-directory: installer
        run: |
          gofmt -w main.go
          go test -buildvcs=false ./...
          go vet -buildvcs=false ./...
          go build -buildvcs=false -trimpath -ldflags="-s -w -H windowsgui" -o JTSN_Setup_v5.63.exe .
          $hash=(Get-FileHash JTSN_Setup_v5.63.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  JTSN_Setup_v5.63.exe" | Set-Content -Encoding ascii JTSN_Setup_v5.63.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: JTSN-v5.63-update-ui-test
          path: |
            installer/JTSN_Setup_v5.63.exe
            installer/JTSN_Setup_v5.63.exe.sha256
          if-no-files-found: error
          retention-days: 7
